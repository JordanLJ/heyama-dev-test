services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # No host port — avoids clashes with other apps on the VPS
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data

  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      set -e;
      echo Waiting for MinIO...;
      i=0;
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        i=$$((i+1));
        if [ $$i -ge 30 ]; then
          echo 'MinIO not ready after 60s — check credentials / volume';
          exit 1;
        fi;
        echo retry $$i...;
        sleep 2;
      done;
      mc mb --ignore-existing local/objects;
      mc anonymous set download local/objects;
      echo Bucket ready;
      "

  backend:
    build:
      context: ./Backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      USE_MEMORY_DB: "false"
      MONGODB_URI: mongodb://mongo:27017/objects
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: objects
      S3_REGION: us-east-1
      # Browser-facing URL (host machine / public URL)
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9010/objects}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3010}
    depends_on:
      mongo:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./Frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - "3010:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
  minio_data:
  backend_uploads:
